[project]
name = "produktionsplanung"
version = "0.1.0"
description = "Produktionsplanung und Materialdisposition, Ablösung von Produktionsplanung_V7_3.xlsm"
requires-python = ">=3.12"
dependencies = [
    # "standard" bringt die fastapi-CLI mit, die in den Befehlen steht
    # (uv run fastapi dev app/main.py) sowie uvicorn und python-multipart.
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
